services:
  spring-app:
    image: ghcr.io/arvl130/mmm:master
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    ports:
      - "10110:8080"
    environment:
      SPRING_DATASOURCE_DRIVERCLASSNAME: ${SPRING_DATASOURCE_DRIVERCLASSNAME}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BEDROCK_MODEL_ID: ${AWS_BEDROCK_MODEL_ID}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_BUCKET_BASE_URL: ${AWS_S3_BUCKET_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM_URL: ${MAIL_FROM_URL}
      APP_URL: ${APP_URL}
